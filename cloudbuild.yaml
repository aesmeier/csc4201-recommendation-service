steps:
# --- Run unit tests ---
- name: python
  entrypoint: bash
  args:
    - -c
    - |
      cd recommendation
      pip install -r requirements.txt -r requirements-dev.txt --user
      python -m pytest

# --- Build image ---
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/recommendation:${_TAG}', './recommendation']

# --- Push image ---
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/recommendation:${_TAG}']

# --- Deploy to Cloud Run, wired to the real Cart and Catalog services ---
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  entrypoint: bash
  args:
    - -c
    - |
      gcloud run deploy recommendation \
        --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/recommendation:${_TAG} \
        --region ${_REGION} --platform managed --allow-unauthenticated --port 8080 \
        --service-account=logging-writer@project-mirco.iam.gserviceaccount.com \
        --set-env-vars CART_SERVICE_URL=${_CART_URL},CATALOG_SERVICE_URL=${_CATALOG_URL},CORS_URL=${_CORS_URL}

images:
- '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/recommendation:${_TAG}'

substitutions:
  _REGION: us-central1
  _REPO: ecommerce-repo
  _TAG: manual
  _CART_URL: https://cart-service-887823769496.us-central1.run.app
  _CATALOG_URL: https://catalog-dummy-puujfj4w6q-uc.a.run.app
  _CORS_URL: https://frontend-service-887823769496.us-central1.run.app

options:
  logging: CLOUD_LOGGING_ONLY